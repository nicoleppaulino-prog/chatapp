<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Chatapp</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .box { background: white; max-width: 700px; margin: auto; padding: 20px; border-radius: 8px; }
        input { padding: 8px; margin: 4px 0; }
        button { padding: 8px 12px; margin: 4px 0; cursor: pointer; }
        #listaChat button { display: block; width: 100%; text-align: left; }
        #messaggi { border: 1px solid #ddd; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .nascosto { display: none; }
    </style>
</head>
<body>
<div class="box">
    <h1>Chatapp</h1>

    <!-- ACCESSO -->
    <div id="sezioneAccesso">
        <h2>Accedi</h2>
        <input id="email" placeholder="Email"><br>
        <input id="password" type="password" placeholder="Password"><br>
        <button onclick="login()">Accedi</button>

        <h3>Non hai un account?</h3>
        <p>Scegli uno username e usa l'email e la password qui sopra.</p>
        <input id="nuovoUsername" placeholder="Username"><br>
        <button onclick="registrati()">Registrati</button>

        <p id="avvisoAccesso"></p>
    </div>

    <!-- APPLICAZIONE -->
    <div id="sezioneApp" class="nascosto">
        <button onclick="chiediStatistiche()">Mandami le statistiche via email</button>
        <button onclick="esci()">Esci</button>

        <h2>Le mie chat</h2>
        <input id="usernameAltro" placeholder="Username con cui chattare">
        <button onclick="nuovaChat()">Nuova chat</button>
        <div id="listaChat"></div>

        <div id="sezioneChat" class="nascosto">
            <h2 id="titoloChat"></h2>
            <div id="messaggi"></div>
            <input id="testo" placeholder="Scrivi un messaggio" style="width: 60%;"
                   onkeydown="if (event.key === 'Enter') invia()">
            <button onclick="invia()">Invia</button>
            <button onclick="suggerisci()">Suggerisci con IA</button>
        </div>
    </div>
</div>

<script>
    let token = null;        // il braccialetto, arriva dopo il login
    let chatAperta = null;   // id della chat che sto guardando
    let iscrizione = null;   // il canale radio su cui sono sintonizzata

    // la radiolina per i messaggi in diretta
    const radio = new StompJs.Client({ brokerURL: "ws://localhost:8080/ws" });
    radio.activate();

    // funzione di comodo: chiama il backend allegando il braccialetto
    async function chiama(metodo, indirizzo, corpo) {
        const opzioni = { method: metodo, headers: {} };
        if (token) {
            opzioni.headers["Authorization"] = "Bearer " + token;
        }
        if (corpo) {
            opzioni.headers["Content-Type"] = "application/json";
            opzioni.body = JSON.stringify(corpo);
        }

        const risposta = await fetch(indirizzo, opzioni);

        if (!risposta.ok) {
            const errore = await risposta.json().catch(() => ({}));
            throw new Error(errore.message || "Errore " + risposta.status);
        }

        const tipo = risposta.headers.get("Content-Type") || "";
        return tipo.includes("application/json") ? risposta.json() : risposta.text();
    }

    async function login() {
        try {
            const risposta = await chiama("POST", "/auth/login", {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            });
            token = risposta.token;
            document.getElementById("sezioneAccesso").classList.add("nascosto");
            document.getElementById("sezioneApp").classList.remove("nascosto");
            caricaChat();
        } catch (e) {
            document.getElementById("avvisoAccesso").textContent = e.message;
        }
    }

    async function registrati() {
        try {
            const messaggio = await chiama("POST", "/auth/register", {
                username: document.getElementById("nuovoUsername").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            });
            document.getElementById("avvisoAccesso").textContent = messaggio + ". Ora puoi accedere.";
        } catch (e) {
            document.getElementById("avvisoAccesso").textContent = e.message;
        }
    }

    async function caricaChat() {
        const chats = await chiama("GET", "/chat");
        const lista = document.getElementById("listaChat");
        lista.innerHTML = "";

        for (const chat of chats) {
            const nomi = chat.partecipanti.map(p => p.username).join(" e ");
            const bottone = document.createElement("button");
            bottone.textContent = "Chat " + chat.id + ": " + nomi;
            bottone.onclick = () => apriChat(chat.id, nomi);
            lista.appendChild(bottone);
        }
    }

    async function nuovaChat() {
        try {
            const username = document.getElementById("usernameAltro").value;
            await chiama("POST", "/chat/" + username);
            document.getElementById("usernameAltro").value = "";
            caricaChat();
        } catch (e) {
            alert(e.message);
        }
    }

    async function apriChat(id, nomi) {
        if (!radio.connected) {
            alert("Collegamento alla chat in corso, riprova tra un attimo");
            return;
        }

        chatAperta = id;
        document.getElementById("sezioneChat").classList.remove("nascosto");
        document.getElementById("titoloChat").textContent = "Chat: " + nomi;
        document.getElementById("messaggi").innerHTML = "";

        // i messaggi vecchi
        const messaggi = await chiama("GET", "/chat/" + id + "/messaggi");
        messaggi.forEach(mostraMessaggio);

        // mi sintonizzo sul canale di questa chat (e lascio quello di prima)
        if (iscrizione) {
            iscrizione.unsubscribe();
        }
        iscrizione = radio.subscribe("/topic/chat/" + id, arrivo => {
            mostraMessaggio(JSON.parse(arrivo.body));
        });
    }

    function mostraMessaggio(messaggio) {
        const riga = document.createElement("p");
        riga.textContent = messaggio.mittente.username + ": " + messaggio.testo;
        const box = document.getElementById("messaggi");
        box.appendChild(riga);
        box.scrollTop = box.scrollHeight;
    }

    async function invia() {
        const campo = document.getElementById("testo");
        if (campo.value.trim() === "") {
            return;
        }
        try {
            // non lo aggiungo a mano: arriverà dalla radio, come per l'altra persona
            await chiama("POST", "/chat/" + chatAperta + "/messaggi", { testo: campo.value });
            campo.value = "";
        } catch (e) {
            alert(e.message);
        }
    }

    async function suggerisci() {
        const campo = document.getElementById("testo");
        campo.value = "L'IA sta pensando...";
        try {
            const risposta = await chiama("GET", "/chat/" + chatAperta + "/suggerimento");
            campo.value = risposta.testo;
        } catch (e) {
            campo.value = "";
            alert(e.message);
        }
    }

    async function chiediStatistiche() {
        try {
            const messaggio = await chiama("POST", "/utenti/me/statistiche");
            alert(messaggio);
        } catch (e) {
            alert(e.message);
        }
    }

    function esci() {
        location.reload();
    }
</script>
</body>
</html>
